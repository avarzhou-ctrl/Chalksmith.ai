steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - infra/docker/web.Dockerfile
      - -t
      - ${_WEB_IMAGE}
      - --build-arg
      - NEXT_PUBLIC_API_URL=${_API_URL}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_API_KEY=${_FIREBASE_API_KEY}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${PROJECT_ID}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_APP_ID=${_FIREBASE_APP_ID}
      - .
images:
  - ${_WEB_IMAGE}
substitutions:
  _WEB_IMAGE: us-central1-docker.pkg.dev/example/chalksmith/web:latest
  _API_URL: http://localhost:8000
  _FIREBASE_API_KEY: unset
  _FIREBASE_AUTH_DOMAIN: unset
  _FIREBASE_APP_ID: unset
