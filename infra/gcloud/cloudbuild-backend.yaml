steps:
  - name: gcr.io/cloud-builders/docker
    args: [build, -f, infra/docker/api.Dockerfile, -t, ${_API_IMAGE}, .]
  - name: gcr.io/cloud-builders/docker
    args: [build, -f, infra/docker/renderer.Dockerfile, -t, ${_RENDERER_IMAGE}, .]
images:
  - ${_API_IMAGE}
  - ${_RENDERER_IMAGE}
substitutions:
  _API_IMAGE: us-central1-docker.pkg.dev/example/chalksmith/api:latest
  _RENDERER_IMAGE: us-central1-docker.pkg.dev/example/chalksmith/renderer:latest
