steps:
  # Quoted because a plain scalar in a YAML flow sequence cannot contain '{'.
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "docker/api.Dockerfile", "-t", "${_API_IMAGE}", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "docker/renderer.Dockerfile", "-t", "${_RENDERER_IMAGE}", "."]
images:
  - ${_API_IMAGE}
  - ${_RENDERER_IMAGE}
# A build that names its own service account must also say where its logs go.
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _API_IMAGE: us-central1-docker.pkg.dev/example/chalksmith/api:latest
  _RENDERER_IMAGE: us-central1-docker.pkg.dev/example/chalksmith/renderer:latest
