<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Light Reflection & Refraction Physics Lab</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0b0f19;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e2e8f0;
      overflow: hidden;
      position: relative;
    }
    #lab-shell {
      width: 960px;
      height: 540px;
      display: flex;
      position: absolute;
      left: 0;
      top: 0;
      transform-origin: left top;
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    }
    #sidebar {
      width: 320px;
      background-color: #0f172a;
      border-right: 1px solid #1e293b;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 10;
      box-sizing: border-box;
      flex-shrink: 0;
    }
    #canvas-container {
      width: 640px;
      height: 540px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #1e293b 0%, #090d16 100%);
      position: relative;
      overflow: hidden;
    }
    h1 {
      font-size: 1.15rem;
      margin: 0 0 10px 0;
      color: #38bdf8;
      border-bottom: 1px solid #334155;
      padding-bottom: 8px;
      letter-spacing: 0.5px;
    }
    .control-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 0.78rem;
      margin-bottom: 4px;
      color: #94a3b8;
      font-weight: 500;
    }
    .slider-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    input[type="range"] {
      flex-grow: 1;
      accent-color: #38bdf8;
      cursor: pointer;
    }
    .val-display {
      width: 38px;
      text-align: right;
      font-family: monospace;
      font-size: 0.78rem;
      color: #38bdf8;
      font-weight: bold;
    }
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 12px;
    }
    button {
      background-color: #1e293b;
      color: #f3f4f6;
      border: 1px solid #334155;
      padding: 6px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.72rem;
      font-weight: 500;
      line-height: 1.15;
      transition: all 0.15s ease;
    }
    button:hover {
      background-color: #334155;
      border-color: #38bdf8;
    }
    .stats-panel {
      background-color: #111827;
      border-radius: 8px;
      padding: 10px;
      font-size: 0.72rem;
      border: 1px solid #1e293b;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 5px;
    }
    .stat-row:last-child {
      margin-bottom: 0;
    }
    .stat-label {
      color: #94a3b8;
    }
    .stat-val {
      font-family: monospace;
      font-weight: bold;
      color: #38bdf8;
    }
    .stat-val.tir {
      color: #ef4444;
    }
    .formula-box {
      background-color: #030712;
      border-radius: 6px;
      padding: 9px;
      font-family: monospace;
      font-size: 0.68rem;
      line-height: 1.3;
      color: #10b981;
      border-left: 3px solid #10b981;
      margin-top: 10px;
      overflow-wrap: anywhere;
    }
    .instructions {
      font-size: 0.68rem;
      color: #64748b;
      line-height: 1.25;
      text-align: center;
      border-top: 1px solid #1e293b;
      padding-top: 8px;
    }
  </style>
</head>
<body>

  <div id="lab-shell">
  <div id="sidebar">
    <div>
      <h1>Reflection & Refraction</h1>
      
      <div class="control-group">
        <label>Medium 1 (Top) Index: <span id="n1-name">Air</span></label>
        <div class="slider-container">
          <input type="range" id="n1-slider" min="1.0" max="2.5" step="0.01" value="1.0">
          <span class="val-display" id="n1-val">1.00</span>
        </div>
      </div>

      <div class="control-group">
        <label>Medium 2 (Bottom) Index: <span id="n2-name">Glass</span></label>
        <div class="slider-container">
          <input type="range" id="n2-slider" min="1.0" max="2.5" step="0.01" value="1.5">
          <span class="val-display" id="n2-val">1.50</span>
        </div>
      </div>

      <label>Presets</label>
      <div class="btn-grid">
        <button onclick="applyPreset(1.0, 1.33, 'Air', 'Water')">Air → Water</button>
        <button onclick="applyPreset(1.0, 1.5, 'Air', 'Glass')">Air → Glass</button>
        <button onclick="applyPreset(1.5, 1.0, 'Glass', 'Air')">Glass → Air (TIR)</button>
        <button onclick="applyPreset(1.33, 1.0, 'Water', 'Air')">Water → Air</button>
      </div>

      <div class="stats-panel">
        <div class="stat-row">
          <span class="stat-label">Incidence Angle (θ₁):</span>
          <span class="stat-val" id="angle-i">30.0°</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Reflection Angle (θᵣ):</span>
          <span class="stat-val" id="angle-r">30.0°</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Refraction Angle (θ₂):</span>
          <span class="stat-val" id="angle-t">19.5°</span>
        </div>
        <div class="stat-row" id="critical-angle-row">
          <span class="stat-label">Critical Angle (θ_c):</span>
          <span class="stat-val" id="angle-c">N/A</span>
        </div>
      </div>

      <div class="formula-box" id="formula-display">
        <strong>Snell's Law</strong><br>
        n₁sinθ₁ = n₂sinθ₂<br>
        1.00sin30.0° = 1.50sin19.5°
      </div>
    </div>

    <div class="instructions">
      <strong>Interactive:</strong> Drag the glowing laser source to change the incidence angle.
    </div>
  </div>

  <div id="canvas-container"></div>
  </div>

  <script>
    let n1 = 1.0;
    let n2 = 1.5;
    let theta1 = -Math.PI / 6; // -30 degrees (coming from top-left)
    let laserRadius = 240;
    let isDragging = false;
    let pulseOffset = 0;
    let canvas;
    let labScale = 1;
    let labOffsetX = 0;
    let labOffsetY = 0;
    const baseWidth = 960;
    const baseHeight = 540;
    const baseSidebarWidth = 320;
    const canvasWidth = baseWidth - baseSidebarWidth;
    const canvasHeight = baseHeight;

    const nNames = {
      1.0: 'Air',
      1.33: 'Water',
      1.5: 'Glass',
      2.42: 'Diamond'
    };

    function setup() {
      updateLabLayout();
      canvas = createCanvas(canvasWidth, canvasHeight);
      canvas.parent('canvas-container');
      
      // Sync sliders
      document.getElementById('n1-slider').addEventListener('input', (e) => {
        n1 = parseFloat(e.target.value);
        document.getElementById('n1-val').innerText = n1.toFixed(2);
        updateMediumNames();
      });
      document.getElementById('n2-slider').addEventListener('input', (e) => {
        n2 = parseFloat(e.target.value);
        document.getElementById('n2-val').innerText = n2.toFixed(2);
        updateMediumNames();
      });
    }

    function draw() {
      background(11, 15, 25);
      
      let cx = width / 2;
      let cy = height / 2;

      // Draw media backgrounds
      noStroke();
      // Medium 1 (Top)
      fill(15, 23, 42);
      rect(0, 0, width, cy);
      
      // Medium 2 (Bottom) - Color density maps index of refraction
      let m2Color = color(14, 116, 144, map(n2, 1.0, 2.5, 20, 150));
      fill(m2Color);
      rect(0, cy, width, height - cy);

      // Draw Interface boundary line
      stroke(51, 65, 85, 200);
      strokeWeight(2);
      line(0, cy, width, cy);

      // Draw Normal (dashed vertical line)
      stroke(148, 163, 184, 120);
      strokeWeight(1);
      for (let y = 30; y < height - 30; y += 12) {
        line(cx, y, cx, y + 6);
      }

      // Physics math
      let absTheta1 = Math.abs(theta1);
      let sinTheta2 = (n1 / n2) * Math.sin(absTheta1);
      let isTIR = false;
      let theta2 = 0;
      let criticalAngle = n1 > n2 ? Math.asin(n2 / n1) : null;

      if (n1 > n2 && absTheta1 >= criticalAngle) {
        isTIR = true;
      } else {
        theta2 = Math.asin(sinTheta2);
      }

      // Fresnel Equations (Simplified/Realistic reflection/refraction coefficients)
      let R = 1.0; 
      let T = 0.0;
      if (!isTIR) {
        let cos1 = Math.cos(absTheta1);
        let cos2 = Math.cos(theta2);
        let r_ortho = (n1 * cos1 - n2 * cos2) / (n1 * cos1 + n2 * cos2);
        let r_para = (n2 * cos1 - n1 * cos2) / (n2 * cos1 + n1 * cos2);
        R = (r_ortho * r_ortho + r_para * r_para) / 2;
        T = 1.0 - R;
      }

      // Position calculations
      let sourceX = cx + laserRadius * Math.sin(theta1);
      let sourceY = cy - laserRadius * Math.cos(theta1);
      let reflectX = cx - laserRadius * Math.sin(theta1);
      let reflectY = cy - laserRadius * Math.cos(theta1);
      
      let refractX = cx - laserRadius * Math.sin(theta2 * Math.sign(theta1));
      let refractY = cy + laserRadius * Math.cos(theta2);

      // --- Interactive Dragging Logic ---
      let pointer = getCanvasPointer();
      if (mouseIsPressed) {
        if (pointer.inside && (isDragging || dist(pointer.x, pointer.y, sourceX, sourceY) < 30)) {
          isDragging = true;
          let dx = pointer.x - cx;
          let dy = cy - pointer.y;
          if (dy > 10) { // Keep laser pointer in top medium
            theta1 = Math.atan2(dx, dy);
            theta1 = constrain(theta1, -HALF_PI + 0.02, HALF_PI - 0.02);
          }
        }
      } else {
        isDragging = false;
      }

      // Render critical angle limit vectors (if applicable)
      if (criticalAngle) {
        stroke(239, 68, 68, 60);
        strokeWeight(1.5);
        let caX1 = cx - laserRadius * Math.sin(criticalAngle);
        let caX2 = cx + laserRadius * Math.sin(criticalAngle);
        let caY = cy - laserRadius * Math.cos(criticalAngle);
        line(cx, cy, caX1, caY);
        line(cx, cy, caX2, caY);
        fill(239, 68, 68, 120);
        noStroke();
        textSize(11);
        textAlign(LEFT);
        text("Critical Angle Limit", caX2 + 8, caY);
        textAlign(RIGHT);
        text("Critical Angle Limit", caX1 - 8, caY);
      }

      // --- Draw Ray Angles & Arcs ---
      strokeWeight(1);
      // Angle 1 arc
      noFill();
      stroke(56, 189, 248, 150);
      let arcDir = theta1 < 0 ? -HALF_PI : -HALF_PI + theta1;
      let arcLength = theta1 < 0 ? absTheta1 : -absTheta1;
      arc(cx, cy, 70, 70, -HALF_PI - (theta1 < 0 ? absTheta1 : 0), -HALF_PI + (theta1 > 0 ? absTheta1 : 0));
      
      // Angle 2 arc (Refraction)
      if (!isTIR && absTheta1 > 0.01) {
        stroke(16, 185, 129, 150);
        arc(cx, cy, 70, 70, HALF_PI - (theta1 > 0 ? theta2 : 0), HALF_PI + (theta1 < 0 ? theta2 : 0));
      }

      // Draw Labels on Interface
      noStroke();
      fill(255, 255, 255, 180);
      textSize(12);
      textAlign(LEFT);
      text("Medium 1: n₁ = " + n1.toFixed(2), 20, cy - 15);
      text("Medium 2: n₂ = " + n2.toFixed(2), 20, cy + 25);

      // Draw Normal marker "N"
      fill(148, 163, 184, 150);
      textAlign(CENTER);
      text("NORMAL", cx, 25);

      // --- Draw Optical Rays (Glow + Solid center) ---
      pulseOffset = (pulseOffset + 0.01) % 1.0;

      // 1. Incident Ray (Green-Blue light)
      drawRay(sourceX, sourceY, cx, cy, color(56, 189, 248), 1.0);
      drawPulses(sourceX, sourceY, cx, cy, color(56, 189, 248), 1.0);

      // 2. Reflected Ray
      drawRay(cx, cy, reflectX, reflectY, color(244, 63, 94), R);
      drawPulses(cx, cy, reflectX, reflectY, color(244, 63, 94), R);

      // 3. Refracted Ray (if not TIR)
      if (!isTIR) {
        drawRay(cx, cy, refractX, refractY, color(16, 185, 129), T);
        drawPulses(cx, cy, refractX, refractY, color(16, 185, 129), T);
      }

      // --- Draw Laser Gun Element ---
      push();
      translate(sourceX, sourceY);
      rotate(theta1 + HALF_PI);
      rectMode(CENTER);
      fill(30, 41, 59);
      stroke(71, 85, 105);
      strokeWeight(2);
      rect(0, 0, 42, 22, 6);
      fill(244, 63, 94);
      noStroke();
      rect(21, 0, 6, 14, 2);
      // Ring glow on handle to signify draggable
      noFill();
      stroke(56, 189, 248, isDragging ? 255 : 150);
      strokeWeight(2);
      ellipse(0, 0, 32, 32);
      pop();

      // Update UI Text Panels
      updateHTMLStats(absTheta1, theta2, isTIR, criticalAngle, R, T);
    }

    function updateLabLayout() {
      const viewportWidth = Math.max(window.innerWidth, 1);
      const viewportHeight = Math.max(window.innerHeight, 1);
      labScale = Math.min(viewportWidth / baseWidth, viewportHeight / baseHeight) * 0.94;
      labOffsetX = (viewportWidth - baseWidth * labScale) / 2;
      labOffsetY = (viewportHeight - baseHeight * labScale) / 2;

      const shell = document.getElementById('lab-shell');
      shell.style.transform = `translate(${labOffsetX}px, ${labOffsetY}px) scale(${labScale})`;
    }

    function getCanvasPointer() {
      if (!canvas) {
        return { x: 0, y: 0, inside: false };
      }

      const rect = canvas.elt.getBoundingClientRect();
      const x = (winMouseX - rect.left) * (width / rect.width);
      const y = (winMouseY - rect.top) * (height / rect.height);

      return {
        x,
        y,
        inside: x >= 0 && x <= width && y >= 0 && y <= height
      };
    }

    function drawRay(x1, y1, x2, y2, rayColor, intensity) {
      if (intensity < 0.01) return;
      push();
      stroke(red(rayColor), green(rayColor), blue(rayColor), intensity * 40);
      strokeWeight(8);
      line(x1, y1, x2, y2);
      stroke(red(rayColor), green(rayColor), blue(rayColor), intensity * 150);
      strokeWeight(4);
      line(x1, y1, x2, y2);
      stroke(255, 255, 255, intensity * 240);
      strokeWeight(1.5);
      line(x1, y1, x2, y2);
      pop();
    }

    function drawPulses(x1, y1, x2, y2, rayColor, intensity) {
      if (intensity < 0.05) return;
      let count = 3;
      for (let i = 0; i < count; i++) {
        let t = (pulseOffset + i / count) % 1.0;
        let px = lerp(x1, x2, t);
        let py = lerp(y1, y2, t);
        noStroke();
        fill(255, 255, 255, intensity * 220);
        ellipse(px, py, 6, 6);
        fill(red(rayColor), green(rayColor), blue(rayColor), intensity * 100);
        ellipse(px, py, 12, 12);
      }
    }

    function updateHTMLStats(thetaI, thetaT, isTIR, criticalAngle, R, T) {
      let degI = (thetaI * 180 / Math.PI).toFixed(1);
      let degR = degI;
      let degT = isTIR ? "TIR" : (thetaT * 180 / Math.PI).toFixed(1);

      document.getElementById('angle-i').innerText = degI + "°";
      document.getElementById('angle-r').innerText = degR + "°";
      
      let tElement = document.getElementById('angle-t');
      if (isTIR) {
        tElement.innerText = "Total Internal Refl.";
        tElement.className = "stat-val tir";
      } else {
        tElement.innerText = degT + "°";
        tElement.className = "stat-val";
      }

      let cRow = document.getElementById('critical-angle-row');
      let cVal = document.getElementById('angle-c');
      if (criticalAngle) {
        cRow.style.display = "flex";
        cVal.innerText = (criticalAngle * 180 / Math.PI).toFixed(1) + "°";
      } else {
        cRow.style.display = "none";
      }

      // Update interactive Formula visualizer
      let formulaBox = document.getElementById('formula-display');
      if (isTIR) {
        formulaBox.innerHTML = `<strong>Total Internal Reflection</strong><br>θ₁ ${degI}° ≥ θc ${(criticalAngle*180/Math.PI).toFixed(1)}°<br>R 100% | T 0%`;
        formulaBox.style.color = "#ef4444";
        formulaBox.style.borderLeftColor = "#ef4444";
      } else {
        let lhs = (n1 * Math.sin(thetaI)).toFixed(3);
        let rhs = (n2 * Math.sin(thetaT)).toFixed(3);
        formulaBox.innerHTML = `<strong>Snell's Law</strong><br>n₁sinθ₁ = n₂sinθ₂<br>${n1.toFixed(2)}sin${degI}° = ${n2.toFixed(2)}sin${degT}°<br>${lhs} ≈ ${rhs}`;
        formulaBox.style.color = "#10b981";
        formulaBox.style.borderLeftColor = "#10b981";
      }
    }

    function applyPreset(val1, val2, name1, name2) {
      n1 = val1;
      n2 = val2;
      document.getElementById('n1-slider').value = val1;
      document.getElementById('n1-val').innerText = val1.toFixed(2);
      document.getElementById('n2-slider').value = val2;
      document.getElementById('n2-val').innerText = val2.toFixed(2);
      updateMediumNames();
    }

    function updateMediumNames() {
      let m1Name = nNames[n1] || (n1 > 1.3 && n1 < 1.4 ? 'Water/Fluids' : n1 > 1.4 && n1 < 1.6 ? 'Glass/Plastics' : 'Custom Medium');
      let m2Name = nNames[n2] || (n2 > 1.3 && n2 < 1.4 ? 'Water/Fluids' : n2 > 1.4 && n2 < 1.6 ? 'Glass/Plastics' : 'Custom Medium');
      document.getElementById('n1-name').innerText = m1Name;
      document.getElementById('n2-name').innerText = m2Name;
    }

    function windowResized() {
      updateLabLayout();
      resizeCanvas(canvasWidth, canvasHeight);
    }
  </script>
</body>
</html>
