[project]
name = "chalksmith-backend"
version = "2.0.0"
description = "FastAPI backend for Chalksmith.ai"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.128.8",
    "google-auth>=2.56.3",
    "google-cloud-storage>=3.13.1",
    "google-genai>=2.17.0",
    "httpx==0.28.1",
    "openai>=2.53.0",
    "PyJWT[crypto]>=2.10.1,<3",
    "psycopg[binary]>=3.3.4",
    "pydantic==2.13.1",
    "pymupdf>=1.28.2",
    "python-dotenv==1.2.1",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.39",
    "uvicorn==0.39.0",
]

[project.optional-dependencies]
video = [
    "manim==0.19.0",
]

[tool.uv]
package = false
