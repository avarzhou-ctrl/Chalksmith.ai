<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fluid Dynamics Simulator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.2/p5.js"></script>
    <style>
        body { margin: 0; background: #111; color: white; font-family: sans-serif; overflow: hidden; display: flex; flex-direction: column; align-items: center; }
        canvas { border: 1px solid #444; box-shadow: 0 0 20px rgba(0,0,0,0.5); margin-top: 20px;}
        .ui { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; pointer-events: none; width: 280px; border: 1px solid #333; }
        h2 { margin: 0 0 10px 0; font-size: 18px; color: #0cf; }
        p { font-size: 12px; margin: 5px 0; line-height: 1.4; }
        .label { color: #0cf; font-weight: bold; }
    </style>
</head>
<body>
    <div class="ui">
        <h2>Fluid Dynamics: Navier-Stokes</h2>
        <p><span class="label">Advection:</span> Properties moving along the velocity field.</p>
        <p><span class="label">Projection:</span> Forcing "Incompressibility" (Divergence = 0).</p>
        <p><span class="label">Interaction:</span> Drag mouse to stir the fluid and add cyan dye.</p>
    </div>
    <script>
        const N = 64;
        const iter = 10;
        const SCALE = 8;
        
        let density, vx, vy, vx0, vy0, s;

        function setup() {
            createCanvas(N * SCALE, N * SCALE);
            density = new Float32Array(N * N);
            vx = new Float32Array(N * N);
            vy = new Float32Array(N * N);
            vx0 = new Float32Array(N * N);
            vy0 = new Float32Array(N * N);
            s = new Float32Array(N * N);
            background(0);
        }

        function IX(x, y) {
            x = constrain(Math.floor(x), 0, N - 1);
            y = constrain(Math.floor(y), 0, N - 1);
            return x + y * N;
        }

        function step() {
            let dt = 0.2;
            let diff = 0.00001;
            let visc = 0.00001;

            // Velocity Step
            diffuse(1, vx0, vx, visc, dt);
            diffuse(2, vy0, vy, visc, dt);

            project(vx0, vy0, vx, vy);

            advect(1, vx, vx0, vx0, vy0, dt);
            advect(2, vy, vy0, vx0, vy0, dt);

            project(vx, vy, vx0, vy0);

            // Density Step
            diffuse(0, s, density, diff, dt);
            advect(0, density, s, vx, vy, dt);
            
            // Dissipation: prevent the screen from getting too saturated
            for(let i=0; i<density.length; i++) density[i] *= 0.985;
        }

        function diffuse(b, x, x0, diff, dt) {
            let a = dt * diff * (N - 2) * (N - 2);
            lin_solve(b, x, x0, a, 1 + 6 * a);
        }

        function lin_solve(b, x, x0, a, c) {
            let cRecip = 1.0 / c;
            for (let k = 0; k < iter; k++) {
                for (let j = 1; j < N - 1; j++) {
                    for (let i = 1; i < N - 1; i++) {
                        x[IX(i, j)] = (x0[IX(i, j)] + a * (
                            x[IX(i + 1, j)] + 
                            x[IX(i - 1, j)] + 
                            x[IX(i, j + 1)] + 
                            x[IX(i, j - 1)]
                        )) * cRecip;
                    }
                }
                set_bnd(b, x);
            }
        }

        function project(velocX, velocY, p, div) {
            for (let j = 1; j < N - 1; j++) {
                for (let i = 1; i < N - 1; i++) {
                    div[IX(i, j)] = -0.5 * (
                        velocX[IX(i + 1, j)] - velocX[IX(i - 1, j)] + 
                        velocY[IX(i, j + 1)] - velocY[IX(i, j - 1)]
                    ) / N;
                    p[IX(i, j)] = 0;
                }
            }
            set_bnd(0, div);
            set_bnd(0, p);
            lin_solve(0, p, div, 1, 6);

            for (let j = 1; j < N - 1; j++) {
                for (let i = 1; i < N - 1; i++) {
                    velocX[IX(i, j)] -= 0.5 * (p[IX(i + 1, j)] - p[IX(i - 1, j)]) * N;
                    velocY[IX(i, j)] -= 0.5 * (p[IX(i, j + 1)] - p[IX(i, j - 1)]) * N;
                }
            }
            set_bnd(1, velocX);
            set_bnd(2, velocY);
        }

        function advect(b, d, d0, velocX, velocY, dt) {
            let i0, i1, j0, j1;
            let dtx = dt * (N - 2);
            let dty = dt * (N - 2);
            let s0, s1, t0, t1;
            let tmp1, tmp2, x, y;
            let Nfloat = N - 2;

            for (let j = 1; j < N - 1; j++) {
                for (let i = 1; i < N - 1; i++) {
                    tmp1 = dtx * velocX[IX(i, j)];
                    tmp2 = dty * velocY[IX(i, j)];
                    x = i - tmp1;
                    y = j - tmp2;

                    if (x < 0.5) x = 0.5; if (x > Nfloat + 0.5) x = Nfloat + 0.5;
                    i0 = Math.floor(x); i1 = i0 + 1.0;
                    if (y < 0.5) y = 0.5; if (y > Nfloat + 0.5) y = Nfloat + 0.5;
                    j0 = Math.floor(y); j1 = j0 + 1.0;

                    s1 = x - i0; s0 = 1.0 - s1;
                    t1 = y - j0; t0 = 1.0 - t1;

                    d[IX(i, j)] = s0 * (t0 * d0[IX(i0, j0)] + t1 * d0[IX(i0, j1)]) +
                                  s1 * (t0 * d0[IX(i1, j0)] + t1 * d0[IX(i1, j1)]);
                }
            }
            set_bnd(b, d);
        }

        function set_bnd(b, x) {
            for (let i = 1; i < N - 1; i++) {
                x[IX(i, 0)] = b == 2 ? -x[IX(i, 1)] : x[IX(i, 1)];
                x[IX(i, N - 1)] = b == 2 ? -x[IX(i, N - 2)] : x[IX(i, N - 2)];
            }
            for (let j = 1; j < N - 1; j++) {
                x[IX(0, j)] = b == 1 ? -x[IX(1, j)] : x[IX(1, j)];
                x[IX(N - 1, j)] = b == 1 ? -x[IX(N - 2, j)] : x[IX(N - 2, j)];
            }
            x[IX(0, 0)] = 0.5 * (x[IX(1, 0)] + x[IX(0, 1)]);
            x[IX(0, N - 1)] = 0.5 * (x[IX(1, N - 1)] + x[IX(0, N - 2)]);
            x[IX(N - 1, 0)] = 0.5 * (x[IX(N - 2, 0)] + x[IX(N - 1, 1)]);
            x[IX(N - 1, N - 1)] = 0.5 * (x[IX(N - 2, N - 1)] + x[IX(N - 1, N - 2)]);
        }

        function draw() {
            background(0);
            
            if (mouseIsPressed) {
                let i = Math.floor(mouseX / SCALE);
                let j = Math.floor(mouseY / SCALE);
                if (i >= 0 && i < N && j >= 0 && j < N) {
                    // Inject density in a small radius
                    for(let ox = -1; ox <= 1; ox++) {
                        for(let oy = -1; oy <= 1; oy++) {
                            density[IX(i + ox, j + oy)] += 150;
                        }
                    }
                    vx[IX(i, j)] += (mouseX - pmouseX) * 4;
                    vy[IX(i, j)] += (mouseY - pmouseY) * 4;
                }
            }

            step();

            // Render Density
            noStroke();
            for (let i = 0; i < N; i++) {
                for (let j = 0; j < N; j++) {
                    let d = density[IX(i, j)];
                    if (d > 0.5) {
                        // Blue-Cyan palette
                        fill(d * 0.2, d * 0.8, d, 255);
                        rect(i * SCALE, j * SCALE, SCALE, SCALE);
                    }
                }
            }
            
            // Vector Field Visualization (Every 4th cell)
            stroke(255, 30);
            for (let i = 0; i < N; i += 4) {
                for (let j = 0; j < N; j += 4) {
                    let x = i * SCALE;
                    let y = j * SCALE;
                    let u = vx[IX(i, j)];
                    let v = vy[IX(i, j)];
                    if (abs(u) + abs(v) > 0.1) {
                        line(x, y, x + u * 0.5, y + v * 0.5);
                    }
                }
            }
        }
    </script>
</body>
</html>
