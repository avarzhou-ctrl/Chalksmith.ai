<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Area Visualization</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; background: #f0f2f5; font-family: sans-serif; overflow: hidden; }
        canvas { border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .controls { position: absolute; top: 20px; left: 20px; background: rgba(255,255,255,0.9); padding: 15px; border-radius: 8px; }
    </style>
</head>
<body>
    <script>
        let wSlider, hSlider;
        let unitSize = 40;
        let startX = 100;
        let startY = 150;

        function setup() {
            createCanvas(windowWidth, windowHeight);
            
            // Create sliders for interaction
            wSlider = createSlider(1, 10, 5);
            wSlider.position(30, 80);
            hSlider = createSlider(1, 8, 4);
            hSlider.position(30, 130);
        }

        function draw() {
            background(245);

            let wUnits = wSlider.value();
            let hUnits = hSlider.value();
            let area = wUnits * hUnits;

            // UI Text
            fill(44, 62, 80);
            noStroke();
            textSize(24);
            textStyle(BOLD);
            text("Understanding Area", 30, 40);
            
            textStyle(NORMAL);
            textSize(14);
            text(`Width: ${wUnits} units`, 30, 75);
            text(`Height: ${hUnits} units`, 30, 125);

            // Mathematical Explanation
            fill(52, 73, 94);
            textSize(20);
            text(`Formula: Width × Height = Area`, width - 350, 80);
            fill(41, 128, 185);
            text(`${wUnits} × ${hUnits} = ${area} square units`, width - 350, 110);

            // Draw the unit squares
            strokeWeight(1);
            for (let i = 0; i < wUnits; i++) {
                for (let j = 0; j < hUnits; j++) {
                    // Alternating colors for clarity
                    if ((i + j) % 2 === 0) fill(52, 152, 219, 200);
                    else fill(41, 128, 185, 200);
                    
                    stroke(255);
                    rect(startX + i * unitSize, startY + j * unitSize, unitSize, unitSize);
                    
                    // Show count in each square
                    fill(255);
                    noStroke();
                    textSize(10);
                    textAlign(CENTER, CENTER);
                    text(i + 1 + (j * wUnits), startX + i * unitSize + unitSize/2, startY + j * unitSize + unitSize/2);
                }
            }

            // Dimension labels
            textAlign(CENTER);
            fill(44, 62, 80);
            textSize(16);
            // Width label
            text(`${wUnits} Units`, startX + (wUnits * unitSize) / 2, startY - 10);
            // Height label
            push();
            translate(startX - 20, startY + (hUnits * unitSize) / 2);
            rotate(-HALF_PI);
            text(`${hUnits} Units`, 0, 0);
            pop();

            // Educational Tip
            textAlign(LEFT);
            fill(127, 140, 141);
            textSize(14);
            let tip = "Area is the measure of the surface inside a shape.\nWe count how many unit squares fill the boundary.";
            text(tip, 30, height - 60);
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</body>
</html>
