<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Area Explorer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; background: #f0f0f0; font-family: sans-serif; overflow: hidden; }
        canvas { border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .controls { position: absolute; top: 10px; left: 10px; background: rgba(255,255,255,0.9); padding: 15px; border-radius: 8px; max-width: 280px; }
        button { cursor: pointer; padding: 5px 10px; margin: 2px; }
    </style>
</head>
<body>
    <div class="controls">
        <h3 style="margin:0 0 10px 0">Area Explorer</h3>
        <p style="font-size: 12px; margin-bottom: 10px;">Area is the measure of space inside a shape, often calculated in unit squares ($u^2$).</p>
        <button onclick="setShape(0)">Rectangle</button>
        <button onclick="setShape(1)">Triangle</button>
        <button onclick="setShape(2)">Circle</button>
        <div style="margin-top:10px">
            <label id="dim1Label">Width</label>
            <input type="range" id="slider1" min="1" max="10" step="0.5" value="5" oninput="updateValues()">
            <br>
            <label id="dim2Label">Height</label>
            <input type="range" id="slider2" min="1" max="10" step="0.5" value="4" oninput="updateValues()">
        </div>
    </div>

    <script>
        let shapeType = 0; // 0: Rect, 1: Tri, 2: Circ
        let val1 = 5;
        let val2 = 4;
        const unit = 40; // Pixels per unit

        function setup() {
            createCanvas(windowWidth, windowHeight);
            textAlign(CENTER, CENTER);
        }

        function draw() {
            background(245);
            translate(width / 2, height / 2);

            // Draw Grid
            stroke(220);
            strokeWeight(1);
            for (let x = -width/2; x < width/2; x += unit) line(x, -height/2, x, height/2);
            for (let y = -height/2; y < height/2; y += unit) line(-width/2, y, width/2, y);

            // Origin Axes
            stroke(180);
            line(-width/2, 0, width/2, 0);
            line(0, -height/2, 0, height/2);

            noStroke();
            let area = 0;
            let label = "";

            if (shapeType === 0) { // Rectangle
                fill(100, 150, 255, 180);
                rect(- (val1 * unit) / 2, - (val2 * unit) / 2, val1 * unit, val2 * unit);
                area = val1 * val2;
                label = `Area = Base (${val1}) × Height (${val2}) = ${area.toFixed(2)} u²`;
                drawDimensions(val1 * unit, val2 * unit);
            } 
            else if (shapeType === 1) { // Triangle
                fill(100, 255, 150, 180);
                triangle(-(val1*unit)/2, (val2*unit)/2, (val1*unit)/2, (val2*unit)/2, 0, -(val2*unit)/2);
                area = 0.5 * val1 * val2;
                label = `Area = ½ × Base (${val1}) × Height (${val2}) = ${area.toFixed(2)} u²`;
                drawTriangleDimensions(val1 * unit, val2 * unit);
            } 
            else if (shapeType === 2) { // Circle
                fill(255, 100, 100, 180);
                ellipse(0, 0, val1 * 2 * unit);
                area = Math.PI * Math.pow(val1, 2);
                label = `Area = π × r² = π × ${val1}² ≈ ${area.toFixed(2)} u²`;
                // Draw radius
                stroke(0);
                line(0, 0, val1 * unit, 0);
                fill(0);
                noStroke();
                text(`r=${val1}`, (val1 * unit)/2, -15);
            }

            // Text info
            resetMatrix();
            fill(40);
            textSize(22);
            text(label, width / 2, height - 50);
            textSize(14);
            text("Every grid square is 1x1 unit", width / 2, height - 20);
        }

        function drawDimensions(w, h) {
            fill(0);
            textSize(16);
            text(val1, 0, h/2 + 15);
            push();
            translate(-w/2 - 15, 0);
            rotate(-HALF_PI);
            text(val2, 0, 0);
            pop();
        }

        function drawTriangleDimensions(w, h) {
            fill(0);
            text(val1, 0, h/2 + 15);
            stroke(0, 100);
            line(2, -h/2, 2, h/2); // Height line
            noStroke();
            text(val2, 15, 0);
        }

        function setShape(type) {
            shapeType = type;
            const l1 = document.getElementById("dim1Label");
            const l2 = document.getElementById("dim2Label");
            const s2 = document.getElementById("slider2");
            
            if (type === 2) {
                l1.innerText = "Radius";
                l2.style.display = "none";
                s2.style.display = "none";
            } else {
                l1.innerText = type === 0 ? "Width" : "Base";
                l2.innerText = "Height";
                l2.style.display = "inline";
                s2.style.display = "inline";
            }
            updateValues();
        }

        function updateValues() {
            val1 = parseFloat(document.getElementById("slider1").value);
            val2 = parseFloat(document.getElementById("slider2").value);
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</body>
</html>
