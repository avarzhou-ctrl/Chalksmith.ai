<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizing Area - p5.js</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #f0f2f5; font-family: sans-serif; overflow: hidden; }
        #ui { position: absolute; top: 20px; left: 20px; background: rgba(255,255,255,0.9); padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); pointer-events: none; }
        h1 { margin: 0 0 10px 0; font-size: 1.2rem; color: #333; }
        p { margin: 5px 0; font-size: 0.9rem; color: #555; }
    </style>
</head>
<body>
    <div id="ui">
        <h1>What is Area?</h1>
        <p>Area is the 2D space inside a shape.</p>
        <p><b>Drag the blue handle</b> to resize the rectangle.</p>
        <p>Count the unit squares: <span id="formula" style="color:#007bff; font-weight:bold;"></span></p>
    </div>
    <script>
        let unit = 40;
        let rectW = 5, rectH = 3;
        let dragging = false;
        let offsetX = 100, offsetY = 150;

        function setup() {
            createCanvas(windowWidth, windowHeight);
            textAlign(CENTER, CENTER);
        }

        function draw() {
            background(245);
            drawGrid();
            
            let pxW = rectW * unit;
            let pxH = rectH * unit;

            // Draw Area
            fill(0, 123, 255, 150);
            stroke(0, 100, 200);
            strokeWeight(2);
            rect(offsetX, offsetY, pxW, pxH, 4);

            // Draw unit divisions
            stroke(255, 100);
            strokeWeight(1);
            for (let i = 1; i < rectW; i++) line(offsetX + i * unit, offsetY, offsetX + i * unit, offsetY + pxH);
            for (let j = 1; j < rectH; j++) line(offsetX, offsetY + j * unit, offsetX + pxW, offsetY + j * unit);

            // Labels
            fill(50);
            noStroke();
            textSize(16);
            text(`Width: ${rectW}`, offsetX + pxW / 2, offsetY - 20);
            push();
            translate(offsetX - 25, offsetY + pxH / 2);
            rotate(-HALF_PI);
            text(`Height: ${rectH}`, 0, 0);
            pop();

            // Handle
            fill(dragging ? '#ff4757' : '#2ed573');
            stroke(255);
            ellipse(offsetX + pxW, offsetY + pxH, 15, 15);

            // Calculation Display
            document.getElementById('formula').innerText = `${rectW} × ${rectH} = ${rectW * rectH} units²`;

            // Tooltip near mouse
            if (mouseX > offsetX && mouseX < offsetX + pxW && mouseY > offsetY && mouseY < offsetY + pxH) {
                let cellX = floor((mouseX - offsetX) / unit);
                let cellY = floor((mouseY - offsetY) / unit);
                let index = cellY * rectW + cellX + 1;
                fill(255);
                rect(mouseX + 10, mouseY - 25, 40, 20, 5);
                fill(0);
                textSize(12);
                text(`sq ${index}`, mouseX + 30, mouseY - 15);
            }
        }

        function drawGrid() {
            stroke(220);
            strokeWeight(1);
            for (let x = 0; x < width; x += unit) line(x, 0, x, height);
            for (let y = 0; y < height; y += unit) line(0, y, width, y);
        }

        function mousePressed() {
            let d = dist(mouseX, mouseY, offsetX + rectW * unit, offsetY + rectH * unit);
            if (d < 20) dragging = true;
        }

        function mouseDragged() {
            if (dragging) {
                rectW = max(1, round((mouseX - offsetX) / unit));
                rectH = max(1, round((mouseY - offsetY) / unit));
                // Constraints
                rectW = min(rectW, floor((width - offsetX - 40) / unit));
                rectH = min(rectH, floor((height - offsetY - 40) / unit));
            }
        }

        function mouseReleased() {
            dragging = false;
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</body>
</html>
