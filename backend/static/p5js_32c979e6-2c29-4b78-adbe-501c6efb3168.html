<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; background: #f0f2f5; font-family: sans-serif; height: 100vh; overflow: hidden; }
        canvas { border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
<script>
let wSlider, hSlider;
const UNIT = 40; 
const OFFSET_X = 120;
const OFFSET_Y = 180;

function setup() {
    createCanvas(800, 600);
    
    // Create and position sliders
    wSlider = createSlider(1, 15, 8, 1);
    wSlider.position(30, 70);
    wSlider.style('width', '120px');
    
    hSlider = createSlider(1, 10, 5, 1);
    hSlider.position(30, 130);
    hSlider.style('width', '120px');
}

function draw() {
    background(255);
    let rectW = wSlider.value();
    let rectH = hSlider.value();
    let area = rectW * rectH;

    // --- UI/LABELS SECTION ---
    fill(245);
    noStroke();
    rect(15, 15, 160, 150, 5); // Background for controls

    fill(50);
    textStyle(BOLD);
    textSize(14);
    text("RECTANGLE CONTROLS", 20, 35);
    
    textStyle(NORMAL);
    textSize(13);
    fill(80);
    // Label for Width Slider
    text(`Length (l): ${rectW}`, 30, 65);
    // Label for Height Slider
    text(`Width (w): ${rectH}`, 30, 125);
    
    // Formula Section
    textSize(24);
    textStyle(BOLD);
    fill(0, 102, 204);
    textAlign(LEFT);
    text(`Area = Length × Width`, 450, 50);
    text(`${area} = ${rectW} × ${rectH}`, 450, 85);
    textStyle(NORMAL);

    // --- VISUALIZATION SECTION ---
    push();
    translate(OFFSET_X, OFFSET_Y);
    
    // Shadow
    fill(240);
    noStroke();
    rect(5, 5, rectW * UNIT, rectH * UNIT);
    
    // Main Shape
    fill(100, 180, 255, 150);
    stroke(0, 102, 204);
    strokeWeight(2);
    rect(0, 0, rectW * UNIT, rectH * UNIT);

    // Draw Unit Squares (The Grid)
    stroke(0, 102, 204, 80);
    strokeWeight(1);
    for (let i = 0; i <= rectW; i++) {
        line(i * UNIT, 0, i * UNIT, rectH * UNIT);
    }
    for (let j = 0; j <= rectH; j++) {
        line(0, j * UNIT, rectW * UNIT, j * UNIT);
    }

    // Dimension Labels on the Shape
    fill(0);
    noStroke();
    textSize(16);
    textAlign(CENTER);
    text(rectW, (rectW * UNIT) / 2, -15); // Top Label
    textAlign(RIGHT);
    text(rectH, -15, (rectH * UNIT) / 2 + 5); // Left Label

    // Interactive Unit Square Counter
    if (mouseX > OFFSET_X && mouseX < OFFSET_X + rectW * UNIT && mouseY > OFFSET_Y && mouseY < OFFSET_Y + rectH * UNIT) {
        let gx = floor((mouseX - OFFSET_X) / UNIT);
        let gy = floor((mouseY - OFFSET_Y) / UNIT);
        fill(255, 255, 0, 200);
        rect(gx * UNIT, gy * UNIT, UNIT, UNIT);
        
        fill(0);
        textAlign(CENTER, CENTER);
        textSize(10);
        text("1 unit²", gx * UNIT + UNIT/2, gy * UNIT + UNIT/2);
    }
    pop();

    // Footer Explainer text
    fill(100);
    textSize(14);
    textAlign(LEFT);
    text("The Area is the total number of 1x1 unit squares that fit inside the boundary.", 20, 550);
    text("Instructions: Use the sliders to change dimensions. Hover over the grid to see individual units.", 20, 575);
}
</script>
</body>
</html>
