<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area: Parallelograms & Triangles</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.2/p5.min.js"></script>
    <style>
        body { margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; background: #f0f0f0; font-family: sans-serif; }
        canvas { border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .controls { position: absolute; top: 10px; left: 10px; background: rgba(255,255,255,0.9); padding: 15px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="controls">
        <button id="modeBtn">Switch to Triangles</button><br><br>
        <input type="range" id="animSlider" min="0" max="1" step="0.01" value="0" style="width:150px">
        <label id="sliderLabel">Transform</label>
    </div>
    <script>
        let mode = 'parallelogram'; // 'parallelogram' or 'triangle'
        let slider;
        let b = 200, h = 120, offset = 60;

        function setup() {
            createCanvas(600, 400);
            slider = select('#animSlider');
            select('#modeBtn').mousePressed(() => {
                mode = (mode === 'parallelogram') ? 'triangle' : 'parallelogram';
                select('#modeBtn').html(mode === 'parallelogram' ? 'Switch to Triangles' : 'Switch to Parallelograms');
                slider.value(0);
            });
        }

        function draw() {
            background(255);
            let t = parseFloat(slider.value());
            translate(width / 2 - 100, height / 2 + 50);

            if (mode === 'parallelogram') {
                drawParallelogram(t);
            } else {
                drawTriangle(t);
            }
            drawLabels(t);
        }

        function drawParallelogram(t) {
            // Main body (trapezoid left behind)
            fill(100, 150, 250, 200);
            stroke(0, 50, 150);
            strokeWeight(2);
            
            let cutX = offset; 
            beginShape();
            vertex(cutX, 0);
            vertex(b, 0);
            vertex(b + offset, -h);
            vertex(cutX, -h);
            endShape(CLOSE);

            // Moving triangle slice
            push();
            translate(t * b, 0);
            fill(250, 100, 100, 200);
            triangle(0, 0, cutX, 0, cutX, -h);
            pop();

            // Height guide
            stroke(50);
            drawingContext.setLineDash([5, 5]);
            line(cutX, 0, cutX, -h);
            drawingContext.setLineDash([]);
            noStroke();
            fill(0);
            text("h", cutX - 15, -h/2);
        }

        function drawTriangle(t) {
            let x3 = offset, y3 = -h;
            
            // Fixed Triangle
            fill(100, 150, 250, 200);
            stroke(0, 50, 150);
            triangle(0, 0, b, 0, x3, y3);

            // Rotating/Moving Triangle
            push();
            // Move to meeting point and rotate 180 degrees
            translate(b + x3 * t, y3 * t);
            rotate(PI * t);
            fill(250, 100, 100, 200);
            triangle(0, 0, -b, 0, -x3, -y3);
            pop();

            // Dimensions
            stroke(50);
            drawingContext.setLineDash([5, 5]);
            line(x3, 0, x3, y3);
            drawingContext.setLineDash([]);
            noStroke();
            fill(0);
            text("h", x3 + 5, y3/2);
        }

        function drawLabels(t) {
            fill(0);
            noStroke();
            textSize(16);
            textAlign(CENTER);
            
            // Base label
            text("base (b)", b / 2, 25);

            // Formula Area
            textAlign(LEFT);
            textSize(20);
            let title = mode === 'parallelogram' ? "Parallelogram Area" : "Triangle Area";
            let formula = mode === 'parallelogram' ? "Area = base × height" : "Area = ½ × base × height";
            text(title, -150, -200);
            textSize(16);
            fill(100);
            text(formula, -150, -175);

            // Explanation text
            fill(50);
            textSize(14);
            if (mode === 'parallelogram') {
                text("Move the triangle slice to see how", -150, 100);
                text("a parallelogram becomes a rectangle.", -150, 120);
            } else {
                text("Two identical triangles always form", -150, 100);
                text("a parallelogram with Area = b × h.", -150, 120);
            }
        }
    </script>
</body>
</html>
