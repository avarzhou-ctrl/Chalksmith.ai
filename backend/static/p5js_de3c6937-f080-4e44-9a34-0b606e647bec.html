<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pythagorean Theorem Visualization</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; background: #121212; color: white; font-family: sans-serif; overflow: hidden; }
        canvas { border: 1px solid #444; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        #ui { position: absolute; top: 20px; left: 20px; pointer-events: none; }
    </style>
</head>
<body>
    <div id="ui">
        <h1>Pythagorean Theorem</h1>
        <p>Drag the <b>Blue dots</b> to resize the triangle.</p>
        <p>In a right-angled triangle: <b>a² + b² = c²</b></p>
    </div>
    <script>
        let origin, pA, pB;
        let draggingA = false;
        let draggingB = false;

        function setup() {
            createCanvas(windowWidth, windowHeight);
            origin = createVector(width * 0.4, height * 0.6);
            pA = createVector(origin.x, origin.y - 150);
            pB = createVector(origin.x + 200, origin.y);
            textAlign(CENTER, CENTER);
            rectMode(CORNER);
        }

        function draw() {
            background(20);

            let a = origin.y - pA.y;
            let b = pB.x - origin.x;
            let c = Math.sqrt(a * a + b * b);
            let angle = Math.atan2(pA.y - origin.y, pB.x - origin.x);

            // Draw Squares
            noStroke();
            
            // a^2 square (Left)
            fill(255, 80, 80, 150);
            rect(origin.x - a, pA.y, a, a);
            
            // b^2 square (Bottom)
            fill(80, 255, 80, 150);
            rect(origin.x, origin.y, b, b);

            // c^2 square (Hypotenuse)
            fill(80, 150, 255, 150);
            push();
            translate(pA.x, pA.y);
            rotate(angle);
            rect(0, -c, c, c);
            pop();

            // Draw Triangle
            stroke(255);
            strokeWeight(3);
            fill(255, 255, 255, 50);
            triangle(origin.x, origin.y, pA.x, pA.y, pB.x, pB.y);

            // Labels and Values
            noStroke();
            fill(255);
            textSize(18);
            text(`a = ${abs(a/20).toFixed(1)}`, origin.x - 30, (origin.y + pA.y)/2);
            text(`b = ${abs(b/20).toFixed(1)}`, (origin.x + pB.x)/2, origin.y + 25);
            
            push();
            translate((pA.x + pB.x)/2, (pA.y + pB.y)/2);
            rotate(angle);
            text(`c = ${abs(c/20).toFixed(1)}`, 0, -15);
            pop();

            // Equation Display
            fill(255);
            textSize(24);
            let a2 = Math.pow(a/20, 2);
            let b2 = Math.pow(b/20, 2);
            let c2 = Math.pow(c/20, 2);
            text(`${a2.toFixed(1)} + ${b2.toFixed(1)} = ${c2.toFixed(1)}`, width/2, height - 50);
            textSize(14);
            text(`(a²) + (b²) = (c²)`, width/2, height - 25);

            // Interaction Handles
            stroke(255);
            fill(0, 150, 255);
            ellipse(pA.x, pA.y, 15, 15);
            ellipse(pB.x, pB.y, 15, 15);
            
            // Handle Dragging logic
            if (draggingA) pA.y = constrain(mouseY, 50, origin.y - 10);
            if (draggingB) pB.x = constrain(mouseX, origin.x + 10, width - 50);
        }

        function mousePressed() {
            if (dist(mouseX, mouseY, pA.x, pA.y) < 20) draggingA = true;
            if (dist(mouseX, mouseY, pB.x, pB.y) < 20) draggingB = true;
        }

        function mouseReleased() {
            draggingA = false;
            draggingB = false;
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
            origin.set(width * 0.4, height * 0.6);
            pA.x = origin.x;
            pB.y = origin.y;
        }
    </script>
</body>
</html>
