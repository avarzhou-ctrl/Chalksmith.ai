<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cylinder Geometry: Volume & Surface Area</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
        body { margin: 0; font-family: sans-serif; overflow: hidden; background: #f0f2f5; }
        #controls { position: absolute; top: 20px; left: 20px; z-index: 10; background: rgba(255,255,255,0.9); padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 260px; }
        .slider-group { margin-bottom: 15px; }
        label { display: block; font-size: 14px; font-weight: bold; margin-bottom: 5px; color: #333; }
        input[type=range] { width: 100%; cursor: pointer; }
        .stats { font-family: 'Courier New', monospace; font-size: 14px; background: #333; color: #0f0; padding: 10px; border-radius: 4px; line-height: 1.4; }
        h2 { margin: 0 0 10px 0; font-size: 18px; color: #2c3e50; }
    </style>
</head>
<body>
    <div id="controls">
        <h2>Cylinder Explorer</h2>
        <div class="slider-group">
            <label id="r-label">Radius (r): 50</label>
            <input type="range" id="radius" min="20" max="100" value="50">
        </div>
        <div class="slider-group">
            <label id="h-label">Height (h): 100</label>
            <input type="range" id="height" min="40" max="200" value="100">
        </div>
        <div class="slider-group">
            <label id="u-label">Unfold Net: 0%</label>
            <input type="range" id="unfold" min="0" max="100" value="0">
        </div>
        <div class="stats" id="stats"></div>
    </div>

    <script>
        let rSlider, hSlider, uSlider;
        let font;

        function setup() {
            createCanvas(windowWidth, windowHeight, WEBGL);
            rSlider = select('#radius');
            hSlider = select('#height');
            uSlider = select('#unfold');
            textFont('sans-serif');
        }

        function draw() {
            background(240, 242, 245);
            orbitControl();
            
            let r = float(rSlider.value());
            let h = float(hSlider.value());
            let unfold = uSlider.value() / 100;
            
            updateUI(r, h, unfold);

            // Lighting
            ambientLight(150);
            pointLight(255, 255, 255, 200, -200, 300);

            push();
            rotateX(PI / 6);
            rotateY(frameCount * 0.01 * (1 - unfold)); // Stop rotation when unfolding

            // Calculations
            let circumference = 2 * PI * r;
            let baseArea = PI * r * r;
            let lateralArea = circumference * h;
            let totalSA = 2 * baseArea + lateralArea;
            let volume = baseArea * h;

            // DRAW CYLINDER NET OR 3D
            noStroke();
            
            // 1. Top Cap
            push();
            fill(100, 150, 255);
            translate(0, -h/2 - (unfold * r * 1.5), 0);
            rotateX(PI/2);
            cylinder(r, 2);
            pop();

            // 2. Bottom Cap
            push();
            fill(100, 150, 255);
            translate(0, h/2 + (unfold * r * 1.5), 0);
            rotateX(PI/2);
            cylinder(r, 2);
            pop();

            // 3. Lateral Surface (The tricky part: morphing from tube to plane)
            fill(255, 100, 100, 200);
            stroke(255);
            strokeWeight(0.5);
            
            let segments = 48;
            beginShape(QUAD_STRIP);
            for (let i = 0; i <= segments; i++) {
                let theta = map(i, 0, segments, 0, TWO_PI);
                
                // Cylinder coords
                let cx = r * cos(theta);
                let cz = r * sin(theta);
                
                // Flat plane coords
                let fx = map(i, 0, segments, -circumference/2, circumference/2);
                let fz = 0;

                // Interpolate
                let x = lerp(cx, fx, unfold);
                let z = lerp(cz, fz, unfold);
                
                vertex(x, -h/2, z);
                vertex(x, h/2, z);
            }
            endShape();

            pop();

            // Labels in 2D Overlay
            drawLabels(r, h, volume, totalSA);
        }

        function updateUI(r, h, u) {
            select('#r-label').html(`Radius (r): ${r}`);
            select('#h-label').html(`Height (h): ${h}`);
            select('#u-label').html(`Unfold Net: ${Math.round(u * 100)}%`);
            
            let vol = (PI * r * r * h).toFixed(0);
            let sa = (2 * PI * r * r + 2 * PI * r * h).toFixed(0);
            
            select('#stats').html(
                `V = πr²h = ${vol}<br>` +
                `SA = 2πr² + 2πrh = ${sa}<br>` +
                `Circum. = 2πr = ${(2 * PI * r).toFixed(1)}`
            );
        }

        function drawLabels(r, h, vol, sa) {
            // Switch to 2D screen space for text
            push();
            resetMatrix();
            translate(-width/2, -height/2);
            fill(44, 62, 80);
            noStroke();
            textSize(16);
            
            let xOff = 300;
            let yOff = height - 80;
            
            text("FORMULAS:", xOff, yOff);
            textSize(14);
            text("Volume: Capacity inside the cylinder.", xOff, yOff + 20);
            text("Surface Area: Total area of 2 circles + 1 rectangle.", xOff, yOff + 40);
            
            // Visual indicators for r and h
            stroke(0);
            line(width - 150, height/2 - h/2, width - 150, height/2 + h/2);
            noStroke();
            text("h", width - 140, height/2);
            pop();
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</body>
</html>
