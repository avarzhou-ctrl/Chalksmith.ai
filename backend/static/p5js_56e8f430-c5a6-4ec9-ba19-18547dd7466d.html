<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive DNA Double Helix</title>
    <!-- p5.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        #controls {
            margin-top: 15px;
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            font-size: 14px;
        }
        label {
            margin-bottom: 5px;
            color: #94a3b8;
        }
        input[type="range"] {
            width: 150px;
            accent-color: #38bdf8;
        }
        .btn {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 8px 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #0ea5e9;
        }
        #info-panel {
            max-width: 800px;
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
            color: #cbd5e1;
        }
    </style>
</head>
<body>

<div id="container">
    <div id="canvas-container"></div>
    <div id="controls">
        <div class="control-group">
            <label for="unzip-slider">Unzip Helix (Helicase Action)</label>
            <input type="range" id="unzip-slider" min="0" max="1" step="0.01" value="0">
        </div>
        <div class="control-group">
            <label for="speed-slider">Rotation Speed</label>
            <input type="range" id="speed-slider" min="0" max="0.05" step="0.001" value="0.015">
        </div>
        <button class="btn" id="mutate-btn">Introduce Mutation</button>
        <button class="btn" id="reset-btn">Reset DNA</button>
    </div>
</div>

<div id="info-panel">
    Hover over base pairs to inspect hydrogen bonding. Drag sliders to open the replication fork.
</div>

<script>
let numPairs = 18;
let rotAngle = 0;
let basePairs = [];
let hoveredIdx = -1;
let mutationIdx = -1;
let mutationTimer = 0;

// Setup sliders and buttons in p5.js
let unzipSlider, speedSlider;

const BASE_COLORS = {
    'A': '#38bdf8', // Adenine (Cyan)
    'T': '#f59e0b', // Thymine (Amber/Orange)
    'C': '#22c55e', // Cytosine (Green)
    'G': '#ef4444'  // Guanine (Red)
};

const COMPLEMENTS = { 'A': 'T', 'T': 'A', 'C': 'G', 'G': 'C' };

function setup() {
    let canvas = createCanvas(800, 520);
    canvas.parent('canvas-container');
    
    unzipSlider = select('#unzip-slider');
    speedSlider = select('#speed-slider');
    
    select('#mutate-btn').mousePressed(triggerMutation);
    select('#reset-btn').mousePressed(resetDNA);

    generateDNASequence();
}

function generateDNASequence() {
    basePairs = [];
    let bases = ['A', 'T', 'C', 'G'];
    for (let i = 0; i < numPairs; i++) {
        let b1 = random(bases);
        let b2 = COMPLEMENTS[b1];
        basePairs.push({ b1: b1, b2: b2, mutated: false });
    }
    mutationIdx = -1;
}

function triggerMutation() {
    mutationIdx = floor(random(0, numPairs));
    // Purposely mismatch pair to demonstrate error (e.g., A-G or C-T)
    let bases = ['A', 'T', 'C', 'G'];
    let b1 = basePairs[mutationIdx].b1;
    let wrongBases = bases.filter(b => b !== COMPLEMENTS[b1] && b !== b1);
    basePairs[mutationIdx].b2 = random(wrongBases);
    basePairs[mutationIdx].mutated = true;
    mutationTimer = 180; // keep glow active
}

function resetDNA() {
    generateDNASequence();
}

function draw() {
    background('#0f172a');
    
    // UI Layout coordinates
    let dnxX = 300; // DNA helix center X
    let panelX = 560; // Info panel left margin
    
    // Sliders input
    let unzipFactor = parseFloat(unzipSlider.value());
    let rotSpeed = parseFloat(speedSlider.value());
    rotAngle += rotSpeed;

    // Draw grid background aesthetic
    stroke('rgba(255, 255, 255, 0.03)');
    strokeWeight(1);
    for (let i = 0; i < width; i += 40) line(i, 0, i, height);
    for (let j = 0; j < height; j += 40) line(0, j, width, j);

    // Dynamic Title & Legend
    drawLegend();
    
    // 3D-like Double Helix Rendering
    let startY = 60;
    let endY = height - 60;
    let segmentSpacing = (endY - startY) / (numPairs - 1);
    let radius = 70;
    
    hoveredIdx = -1;

    // Calculate all 3D projected coordinates first
    let points = [];
    for (let i = 0; i < numPairs; i++) {
        let y = startY + i * segmentSpacing;
        // Pitch/twist offset along the helix axis
        let nodeAngle = rotAngle + (i * 0.5); 
        
        // Define standard coordinates
        let x1 = dnxX + sin(nodeAngle) * radius;
        let z1 = cos(nodeAngle) * radius;
        let x2 = dnxX + sin(nodeAngle + PI) * radius;
        let z2 = cos(nodeAngle + PI) * radius;
        
        // Apply unzipping factor (Helicase splits strands starting from the top)
        // Upper nodes unzip/spread apart laterally
        let unzipProgress = map(i, 0, numPairs, 1, 0); // unzip starts top (0) to bottom
        if (unzipProgress < unzipFactor) {
            let separation = map(unzipFactor - unzipProgress, 0, 1, 0, 160);
            x1 -= separation;
            x2 += separation;
        }

        points.push({ x1, y, z1, x2, y, z2, angle: nodeAngle });
    }

    // Check Hover
    for (let i = 0; i < numPairs; i++) {
        let p = points[i];
        let d1 = dist(mouseX, mouseY, p.x1, p.y);
        let d2 = dist(mouseX, mouseY, p.x2, p.y);
        if (d1 < 15 || d2 < 15 || (mouseY >= p.y - 10 && mouseY <= p.y + 10 && mouseX >= min(p.x1, p.x2) && mouseX <= max(p.x1, p.x2))) {
            hoveredIdx = i;
        }
    }

    // Draw Strands
    // Back connections first (z < 0) for visual depth
    for (let i = 0; i < numPairs; i++) {
        let p = points[i];
        let bp = basePairs[i];
        let isUnzipped = (map(i, 0, numPairs, 1, 0) < unzipFactor);
        
        // Base connection lines (rungs)
        if (!isUnzipped) {
            strokeWeight(hoveredIdx === i ? 6 : 4);
            if (bp.mutated) {
                stroke('#f43f5e'); // red warning highlight
            } else {
                stroke('rgba(255,255,255,0.4)');
            }
            line(p.x1, p.y, p.x2, p.y);
            
            // Draw H-bond indicator ticks
            drawHydrogenBonds((p.x1 + p.x2)/2, p.y, bp.b1, bp.mutated);
        } else {
            // Draw unzipped hydrogen bond breaks (fading dashed lines)
            stroke('rgba(255,255,255,0.1)');
            strokeWeight(1);
            drawingContext.setLineDash([5, 5]);
            line(p.x1, p.y, p.x2, p.y);
            drawingContext.setLineDash([]); // Reset
        }
    }

    // Draw Sugar-Phosphate Backbones
    strokeWeight(6);
    // Strand 1 Backbone
    for (let i = 0; i < numPairs - 1; i++) {
        let col = color('#38bdf8');
        col.setAlpha(map(points[i].z1, -radius, radius, 120, 255));
        stroke(col);
        line(points[i].x1, points[i].y, points[i+1].x1, points[i+1].y);
    }
    // Strand 2 Backbone
    for (let i = 0; i < numPairs - 1; i++) {
        let col = color('#a855f7'); // purple back strand
        col.setAlpha(map(points[i].z2, -radius, radius, 120, 255));
        stroke(col);
        line(points[i].x2, points[i].y, points[i+1].x2, points[i+1].y);
    }

    // Draw Nucleoside base nodes
    for (let i = 0; i < numPairs; i++) {
        let p = points[i];
        let bp = basePairs[i];
        let size1 = map(p.z1, -radius, radius, 12, 22);
        let size2 = map(p.z2, -radius, radius, 12, 22);
        
        // Highlight selected base pair
        if (hoveredIdx === i) {
            size1 += 4;
            size2 += 4;
        }

        // Left base (Strand 1)
        fill(BASE_COLORS[bp.b1]);
        noStroke();
        ellipse(p.x1, p.y, size1);
        fill(0);
        textAlign(CENTER, CENTER);
        textSize(size1 * 0.6);
        textStyle(BOLD);
        text(bp.b1, p.x1, p.y);

        // Right base (Strand 2)
        fill(BASE_COLORS[bp.b2]);
        noStroke();
        ellipse(p.x2, p.y, size2);
        fill(0);
        textSize(size2 * 0.6);
        text(bp.b2, p.x2, p.y);
        
        // Mutated label warning
        if (bp.mutated && (frameCount % 30 < 15)) {
            fill('#f43f5e');
            textSize(10);
            textStyle(BOLD);
            text("MUTATION", (p.x1 + p.x2)/2, p.y - 12);
        }
    }

    // Labels for prime ends (Directionality 5' to 3')
    fill('#94a3b8');
    textSize(14);
    textStyle(BOLD);
    text("5' End", points[0].x1 - 30, points[0].y - 20);
    text("3' End", points[numPairs-1].x1 - 30, points[numPairs-1].y + 20);
    text("3' End", points[0].x2 + 30, points[0].y - 20);
    text("5' End", points[numPairs-1].x2 + 30, points[numPairs-1].y + 20);

    // Info Panel Rendering (Right side of canvas)
    drawInfoPanel(panelX, unzipFactor);
}

function drawHydrogenBonds(mx, my, base, isMutated) {
    // A-T has 2 bonds, C-G has 3 bonds
    strokeWeight(2);
    stroke('#e2e8f0');
    if (isMutated) stroke('#ef4444');
    
    let numBonds = (base === 'A' || base === 'T') ? 2 : 3;
    if (numBonds === 2) {
        line(mx - 8, my - 3, mx + 8, my - 3);
        line(mx - 8, my + 3, mx + 8, my + 3);
    } else {
        line(mx - 8, my - 5, mx + 8, my - 5);
        line(mx - 8, my, mx + 8, my);
        line(mx - 8, my + 5, mx + 8, my + 5);
    }
}

function drawLegend() {
    fill(255);
    noStroke();
    textAlign(LEFT, TOP);
    textSize(20);
    textStyle(BOLD);
    text("DNA Structure & Dynamics", 20, 20);
    
    textSize(12);
    textStyle(NORMAL);
    fill('#94a3b8');
    text("Interactive Educational Model", 20, 45);

    // Color Legend
    let legendY = 80;
    let spacing = 25;
    let bases = ['Adenine (A)', 'Thymine (T)', 'Cytosine (C)', 'Guanine (G)'];
    let keys = ['A', 'T', 'C', 'G'];
    
    for (let i = 0; i < 4; i++) {
        fill(BASE_COLORS[keys[i]]);
        ellipse(30, legendY + i * spacing, 14);
        fill('#e2e8f0');
        textAlign(LEFT, CENTER);
        text(bases[i], 45, legendY + i * spacing);
    }
}

function drawInfoPanel(x, unzipVal) {
    fill('#1e293b');
    stroke('#334155');
    strokeWeight(2);
    rect(x, 20, 220, height - 40, 8);

    noStroke();
    fill('#f8fafc');
    textSize(16);
    textStyle(BOLD);
    textAlign(LEFT, TOP);
    text("Interactive Analyzer", x + 15, 35);

    // Dynamic Text based on user interaction
    textSize(13);
    textStyle(NORMAL);
    fill('#94a3b8');

    if (unzipVal > 0.1) {
        fill('#f43f5e');
        textStyle(BOLD);
        text("⚡ HELICASE ACTIVE", x + 15, 70);
        textStyle(NORMAL);
        fill('#cbd5e1');
        text("The enzyme Helicase breaks hydrogen bonds to unzip the double helix, creating a Replication Fork.", x + 15, 95, 190, 150);
        text("\nSingle-strand binding proteins stabilize the open helix to facilitate transcription or DNA replication.", x + 15, 180, 190, 150);
    } else if (hoveredIdx !== -1) {
        let bp = basePairs[hoveredIdx];
        fill('#38bdf8');
        textStyle(BOLD);
        text(`INSPECTING BASE PAIR #${hoveredIdx + 1}`, x + 15, 70);
        
        textStyle(NORMAL);
        fill('#cbd5e1');
        
        let bondCount = (bp.b1 === 'A' || bp.b1 === 'T') ? "2 Hydrogen Bonds" : "3 Hydrogen Bonds";
        if (bp.mutated) {
            fill('#ef4444');
            text(`🚨 MUTATION DETECTED!\n\nMismatched Base Pair:\n[${bp.b1}] paired with [${bp.b2}].\n\nNormally, ${bp.b1} pairs exclusively with ${COMPLEMENTS[bp.b1]}. This distortion can disrupt transcription.`, x + 15, 95, 190, 300);
        } else {
            text(`Selected Bases:\n- Left: ${bp.b1}\n- Right: ${bp.b2}\n\nHydrogen Bonding:\n${bondCount}\n\nPurines (A, G) always pair with Pyrimidines (T, C) maintaining a constant helix width.`, x + 15, 95, 190, 300);
        }
    } else {
        fill('#38bdf8');
        textStyle(BOLD);
        text("DNA BACKBONE (5' ➔ 3')", x + 15, 70);
        textStyle(NORMAL);
        fill('#cbd5e1');
        text("The outer railing consists of alternating Deoxyribose sugars and phosphate functional groups.\n\nThe complementary strands run in opposite 'Antiparallel' directions (indicated by the 5' and 3' prime labels).", x + 15, 95, 190, 180);
        
        fill('#f59e0b');
        textStyle(BOLD);
        text("PRO TIP:", x + 15, 290);
        textStyle(NORMAL);
        fill('#cbd5e1');
        text("Click 'Introduce Mutation' to see how incorrect base pairing destabilizes the double helix structure.", x + 15, 310, 190, 100);
    }

    // Static Base-Pair Rule display at bottom of panel
    stroke('#334155');
    strokeWeight(1);
    line(x + 10, height - 85, x + 210, height - 85);
    noStroke();
    fill('#94a3b8');
    textSize(11);
    textAlign(CENTER);
    text("Chargaff's Rule: A ≡ T  |  C ≡ G", x + 110, height - 70);
}
</script>

</body>
</html>
