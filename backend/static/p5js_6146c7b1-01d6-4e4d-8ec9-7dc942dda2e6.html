<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; background: #f0f2f5; font-family: sans-serif; height: 100vh; overflow: hidden; }
        #ui { position: absolute; top: 20px; left: 20px; background: rgba(255,255,255,0.9); padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 220px; }
        .slider-label { display: block; margin-top: 10px; font-weight: bold; color: #333; }
        canvas { border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div id="ui">
        <h2 style="margin:0 0 10px 0; color:#2c3e50;">Area Explorer</h2>
        <span class="slider-label">Width: <span id="wVal">5</span></span>
        <input type="range" id="wSlider" min="1" max="12" value="5" style="width:100%">
        <span class="slider-label">Height: <span id="hVal">4</span></span>
        <input type="range" id="hSlider" min="1" max="8" value="4" style="width:100%">
        <hr>
        <p id="formula" style="font-size: 1.1em; color: #e67e22; font-weight: bold;"></p>
        <p style="font-size: 0.85em; color: #7f8c8d;">Area is the number of unit squares that fit inside a shape.</p>
    </div>

<script>
let wS, hS;
let gridSize = 40;
let offsetX = 280;
let offsetY = 100;

function setup() {
    createCanvas(800, 500);
    wS = select('#wSlider');
    hS = select('#hSlider');
}

function draw() {
    background(245);
    
    // Retrieve values from sliders
    let w = int(wS.value());
    let h = int(hS.value());
    
    // Update UI text
    select('#wVal').html(w);
    select('#hVal').html(h);
    select('#formula').html(`${w} (Width) × ${h} (Height) = ${w * h} Units²`);

    // Draw background grid
    stroke(220);
    strokeWeight(1);
    for (let i = 0; i <= 12; i++) line(offsetX + i * gridSize, offsetY, offsetX + i * gridSize, offsetY + 8 * gridSize);
    for (let j = 0; j <= 8; j++) line(offsetX, offsetY + j * gridSize, offsetX + 12 * gridSize, offsetY + j * gridSize);

    // Draw the active Area
    noStroke();
    for (let i = 0; i < w; i++) {
        for (let j = 0; j < h; j++) {
            // Pulse animation based on time
            let pulse = sin(frameCount * 0.05 + (i + j) * 0.3) * 15;
            fill(52, 152, 219, 180 + pulse);
            rect(offsetX + i * gridSize + 2, offsetY + j * gridSize + 2, gridSize - 4, gridSize - 4, 4);
            
            // Draw unit number
            fill(255);
            textAlign(CENTER, CENTER);
            textSize(12);
            text((i + j * w) + 1, offsetX + i * gridSize + gridSize/2, offsetY + j * gridSize + gridSize/2);
        }
    }

    // Outer Border
    noFill();
    stroke(41, 128, 185);
    strokeWeight(3);
    rect(offsetX, offsetY, w * gridSize, h * gridSize, 4);

    // Labels
    fill(44, 62, 80);
    noStroke();
    textSize(18);
    textStyle(BOLD);
    textAlign(CENTER);
    
    // Width Label
    text("Width: " + w, offsetX + (w * gridSize) / 2, offsetY - 15);
    
    // Height Label (rotated)
    push();
    translate(offsetX - 25, offsetY + (h * gridSize) / 2);
    rotate(-HALF_PI);
    text("Height: " + h, 0, 0);
    pop();

    // Visual helper for "Area = count"
    fill(127, 140, 141);
    textStyle(NORMAL);
    textSize(14);
    textAlign(CENTER);
    text(`Each square is 1 "Unit²"`, offsetX + (12 * gridSize) / 2, offsetY + (8 * gridSize) + 40);
}
</script>
</body>
</html>
