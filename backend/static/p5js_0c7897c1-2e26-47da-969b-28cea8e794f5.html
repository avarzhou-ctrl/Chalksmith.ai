<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Area of Composite Shapes Lesson</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
        body { margin: 0; display: flex; flex-direction: column; align-items: center; background: #f0f2f5; font-family: sans-serif; }
        #ui { margin-top: 10px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; border-radius: 5px; border: none; background: #2563eb; color: white; transition: 0.2s; }
        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <div id="ui">
        <button onclick="nextStep()">Next Step</button>
        <button onclick="reset()">Reset</button>
    </div>
    <script>
        let step = 0;
        let anim = 0;
        const SHAPE_COLOR = [100, 150, 250];
        const PART1_COLOR = [255, 100, 100];
        const PART2_COLOR = [100, 200, 100];

        function setup() {
            createCanvas(600, 450);
            textAlign(CENTER, CENTER);
            textSize(16);
        }

        function draw() {
            background(255);
            translate(100, 100);
            
            // Dimensions
            let w1 = 120, h1 = 200; // Left tall rect
            let w2 = 180, h2 = 80;  // Right flat rect
            
            if (step === 0) {
                fill(SHAPE_COLOR);
                stroke(0);
                strokeWeight(2);
                beginShape();
                vertex(0, 0); vertex(w1, 0); vertex(w1, h1-h2);
                vertex(w1+w2, h1-h2); vertex(w1+w2, h1); vertex(0, h1);
                endShape(CLOSE);
                drawLabels(w1, h1, w2, h2, false);
                drawInstruction("What is the total area of this L-shaped figure?");
            } 
            else if (step >= 1) {
                anim = lerp(anim, 1, 0.05);
                let offset = anim * 20;

                // Part 1
                fill(step >= 2 ? PART1_COLOR : SHAPE_COLOR);
                rect(0, 0, w1, h1);
                
                // Part 2
                fill(step >= 2 ? PART2_COLOR : SHAPE_COLOR);
                rect(w1 + offset, h1 - h2, w2, h2);

                drawLabels(w1, h1, w2, h2, true, offset);

                if (step === 1) {
                    drawInstruction("Step 1: Decompose the shape into basic rectangles.");
                } else if (step === 2) {
                    drawInstruction("Step 2: Calculate Area of each part (A = w × h).");
                    fill(0);
                    text(`A1 = ${w1} × ${h1} = ${w1*h1}`, w1/2, h1/2);
                    text(`A2 = ${w2} × ${h2} = ${w2*h2}`, w1 + offset + w2/2, h1 - h2/2);
                } else if (step === 3) {
                    drawInstruction("Step 3: Add the areas together.");
                    fill(0);
                    textSize(22);
                    text(`Total Area = ${w1*h1} + ${w2*h2} = ${(w1*h1)+(w2*h2)} units²`, (w1+w2)/2 + 20, h1 + 60);
                    textSize(16);
                }
            }
        }

        function drawLabels(w1, h1, w2, h2, split, offset = 0) {
            fill(0);
            noStroke();
            // Dimensions
            text(w1, w1/2, -15); // Top 1
            text(h1, -25, h1/2); // Left
            if (!split) {
                text(w2, w1 + w2/2, h1 - h2 - 15);
                text(h2, w1 + w2 + 20, h1 - h2/2);
                text(w1 + w2, (w1+w2)/2, h1 + 20);
            } else {
                text(w2, w1 + offset + w2/2, h1 - h2 - 15);
                text(h2, w1 + offset + w2 + 20, h1 - h2/2);
            }
        }

        function drawInstruction(msg) {
            resetMatrix();
            fill(50);
            noStroke();
            rect(0, 0, width, 50);
            fill(255);
            text(msg, width/2, 25);
        }

        function nextStep() {
            if (step < 3) step++;
        }

        function reset() {
            step = 0;
            anim = 0;
        }
    </script>
</body>
</html>
