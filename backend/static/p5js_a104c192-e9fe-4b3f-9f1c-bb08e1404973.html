<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Understanding Area</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1e1e2f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        canvas {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <script>
        let cellSize = 60;
        let startCol = 2;
        let startRow = 2;
        let rectCols = 5;
        let rectRows = 4;
        let isDragging = false;
        
        let maxCols = 10;
        let maxRows = 7;

        function setup() {
            createCanvas(800, 600);
            cursor(CROSS);
        }

        function draw() {
            background('#f0f4f8');
            
            drawGrid();
            drawArea();
            drawDimensions();
            drawHandle();
            checkHover();
            drawUI();
        }

        function drawGrid() {
            stroke(200);
            strokeWeight(1);
            for (let x = 0; x <= width; x += cellSize) {
                line(x, 0, x, height);
            }
            for (let y = 0; y <= height; y += cellSize) {
                line(0, y, width, y);
            }
        }

        function drawArea() {
            stroke('#2a9d8f');
            strokeWeight(2);
            fill(42, 157, 143, 80);
            
            let startX = startCol * cellSize;
            let startY = startRow * cellSize;
            let w = rectCols * cellSize;
            let h = rectRows * cellSize;
            
            rect(startX, startY, w, h);
            
            // Draw individual square units inside
            stroke('#2a9d8f');
            strokeWeight(1);
            for (let r = 0; r < rectRows; r++) {
                for (let c = 0; c < rectCols; c++) {
                    fill(42, 157, 143, 40);
                    // Slight margin to emphasize individual squares
                    rect((startCol + c) * cellSize + 2, (startRow + r) * cellSize + 2, cellSize - 4, cellSize - 4, 4);
                }
            }
        }

        function drawDimensions() {
            let startX = startCol * cellSize;
            let startY = startRow * cellSize;
            let endX = startX + rectCols * cellSize;
            let endY = startY + rectRows * cellSize;

            fill(0);
            noStroke();
            textAlign(CENTER, BOTTOM);
            textSize(18);
            text(`Width = ${rectCols} units`, startX + (rectCols * cellSize) / 2, startY - 10);
            
            push();
            translate(startX - 10, startY + (rectRows * cellSize) / 2);
            rotate(-HALF_PI);
            textAlign(CENTER, BOTTOM);
            text(`Height = ${rectRows} units`, 0, -10);
            pop();

            // Dimension lines
            stroke(100);
            strokeWeight(2);
            // Top width line
            line(startX, startY - 8, endX, startY - 8);
            line(startX, startY - 12, startX, startY - 4);
            line(endX, startY - 12, endX, startY - 4);
            // Left height line
            line(startX - 8, startY, startX - 8, endY);
            line(startX - 12, startY, startX - 4, startY);
            line(startX - 12, endY, startX - 4, endY);
        }

        function drawHandle() {
            let handleX = (startCol + rectCols) * cellSize;
            let handleY = (startRow + rectRows) * cellSize;
            
            let pulse = 6 + sin(frameCount * 0.1) * 2;
            
            noStroke();
            fill(231, 111, 81, 150);
            circle(handleX, handleY, pulse * 4);
            
            fill('#e76f51');
            stroke(255);
            strokeWeight(2);
            circle(handleX, handleY, 16);
            
            // Handle label
            noStroke();
            fill('#e76f51');
            textAlign(LEFT, TOP);
            textSize(14);
            text("Drag me!", handleX + 15, handleY + 5);
        }

        function checkHover() {
            let c = floor(mouseX / cellSize);
            let r = floor(mouseY / cellSize);
            
            if (c >= startCol && c < startCol + rectCols && r >= startRow && r < startRow + rectRows) {
                // Highlight hovered square
                fill(233, 196, 106, 200);
                stroke('#f4a261');
                strokeWeight(2);
                rect(c * cellSize, r * cellSize, cellSize, cellSize, 4);
                
                // Calculate square number (counting left-to-right, top-to-bottom)
                let squareNum = (r - startRow) * rectCols + (c - startCol) + 1;
                
                fill(0);
                noStroke();
                textAlign(CENTER, CENTER);
                textSize(24);
                text(squareNum, c * cellSize + cellSize / 2, r * cellSize + cellSize / 2);
                
                // Tooltip
                textSize(14);
                fill(50);
                text("Square Unit", c * cellSize + cellSize / 2, r * cellSize + cellSize / 2 + 20);
            }
        }

        function drawUI() {
            fill(255, 255, 255, 230);
            stroke(200);
            strokeWeight(1);
            rect(20, height - 100, width - 40, 80, 10);
            
            fill('#264653');
            noStroke();
            textAlign(LEFT, CENTER);
            textSize(22);
            text("Concept of Area", 40, height - 80);
            
            textSize(16);
            fill('#555');
            text("Area is the number of square units needed to cover a 2D surface.", 40, height - 50);

            // Formula block
            fill('#e9c46a');
            noStroke();
            rect(width - 320, height - 90, 280, 60, 8);
            
            fill(0);
            textAlign(CENTER, CENTER);
            textSize(20);
            let areaVal = rectCols * rectRows;
            text(`Area = Width × Height`, width - 180, height - 75);
            
            textSize(22);
            textStyle(BOLD);
            text(`${rectCols} × ${rectRows} = ${areaVal} square units`, width - 180, height - 45);
            textStyle(NORMAL);
        }

        function mousePressed() {
            let handleX = (startCol + rectCols) * cellSize;
            let handleY = (startRow + rectRows) * cellSize;
            
            if (dist(mouseX, mouseY, handleX, handleY) < 20) {
                isDragging = true;
            }
        }

        function mouseDragged() {
            if (isDragging) {
                let targetCols = round((mouseX - startCol * cellSize) / cellSize);
                let targetRows = round((mouseY - startRow * cellSize) / cellSize);
                
                rectCols = constrain(targetCols, 1, maxCols);
                rectRows = constrain(targetRows, 1, maxRows);
            }
        }

        function mouseReleased() {
            isDragging = false;
        }
    </script>
</body>
</html>
